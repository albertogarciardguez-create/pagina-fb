<html><head><meta charset="utf-8">
<style>
@font-face{font-family:MB;src:url(fonts/Montserrat-ExtraBold.ttf)}

</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Plantilla "papel" (Impulso Real): video explicativo en PAPEL RECORTADO, todo dibujado en código.
// Piezas de papel con bordes irregulares, sombra, textura y "boil" de stop-motion a 12 fps; personajes de papel
// genéricos; subtítulos en tiras de papel con la palabra actual marcada; etiquetas con cinta; cierre de marca.
// Escena: {"vis": tipo, "tag": "1", "say": ...}. Tipos en V.<vis>.
const S = window.STORY, T = window.TIMING, HZ = S.formato === 'horizontal', W = HZ ? 1920 : 1080, H = HZ ? 1080 : 1920;
const cv = document.getElementById('c'), g = cv.getContext('2d'); cv.width = W; cv.height = H;
const ST = HZ ? { x: 460, y: -50, s: 1 } : { x: 40, y: 600, s: 1 };  // escenario 1000x1000 de las escenas V2
const OR = '#FF6B3D', C = { crema: '#F4ECD8', kraft: '#C9A06A', teal: '#2F6F73', mostaza: '#E3A72F', coral: '#E8603C', marino: '#26344D',
  rojo: '#C8423A', verde: '#5E8C4A', gris: '#8C8C88', piel: '#E2B48C', pielO: '#C9946B', pelo: '#3A2A20', blanco: '#FBF7EE' };
let logo = null, logoBg = '#0B0B0B', TEX = null;
const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const cl = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = p => { p = cl(p, 0, 1); return 0.5 - 0.5 * Math.cos(Math.PI * p); };
const back = p => { p = cl(p, 0, 1); const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
let NOW = 0;
const tick = () => Math.floor(NOW * 12);  // 12 fps de stop-motion

async function load() {
  const L = src => new Promise(r => { if (!src) return r(null); const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
  logo = await L(window.LOGO);
  if (logo) { const c = document.createElement('canvas'); c.width = c.height = 8; const x = c.getContext('2d');
    x.drawImage(logo, 0, 0, 20, 20, 0, 0, 8, 8); const d = x.getImageData(3, 3, 1, 1).data; logoBg = `rgb(${d[0]},${d[1]},${d[2]})`; }
  const tc = document.createElement('canvas'); tc.width = tc.height = 384; const x = tc.getContext('2d');  // textura de papel
  const id = x.createImageData(384, 384);
  for (let k = 0; k < id.data.length; k += 4) { const v = 200 + Math.random() * 55; id.data[k] = id.data[k + 1] = id.data[k + 2] = v; id.data[k + 3] = 255; }
  x.putImageData(id, 0, 0); x.strokeStyle = 'rgba(120,100,80,.25)'; x.lineWidth = 1;
  for (let k = 0; k < 160; k++) { const a = Math.random() * 6.28, px = Math.random() * 384, py = Math.random() * 384, l = 6 + Math.random() * 22; x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke(); }
  TEX = g.createPattern(tc, 'repeat');
  await document.fonts.load('900 100px "Noto Serif CJK SC"', '忍'); await document.fonts.load('80px MB'); await document.fonts.load('40px MS'); await document.fonts.load('40px MR');
  window.READY = true;
}
const sceneAt = t => { let i = 0; while (i + 1 < T.cuts.length && t >= T.cuts[i + 1]) i++; return i; };
const winEnd = i => i + 1 < T.cuts.length ? T.cuts[i + 1] : T.total;
const sentAt = (i, s, f) => { const ss = T.scenes[i].sents, se = ss[Math.min(s || 0, ss.length - 1)]; return se.start + (f || 0) * (se.end - se.start); };

// ---------- papel: polígonos con borde irregular, sombra, textura y boil ----------
function poly(pts, seed, amt) {  // traza un contorno recortado a mano
  g.beginPath(); const n = pts.length, tk = tick();
  for (let e = 0; e < n; e++) { const [ax, ay] = pts[e], [bx, by] = pts[(e + 1) % n], L = Math.hypot(bx - ax, by - ay), m = Math.max(1, Math.round(L / 26)), nx = -(by - ay) / (L || 1), ny = (bx - ax) / (L || 1);
    for (let k = 0; k < m; k++) { const f = k / m, j = (rnd(seed * 31 + e * 7 + k + (tk % 3) * 0.37) - 0.5) * (amt ?? 3); const x = ax + (bx - ax) * f + nx * j, y = ay + (by - ay) * f + ny * j; (e || k) ? g.lineTo(x, y) : g.moveTo(x, y); } }
  g.closePath();
}
const rectP = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
const circP = (x, y, r, n) => { n = n || Math.max(14, Math.round(r / 6)); return Array.from({ length: n }, (_, k) => [x + Math.cos(k / n * 6.2832) * r, y + Math.sin(k / n * 6.2832) * r]); };
function papel(pts, color, seed, o) {  // una pieza de papel
  o = o || {}; const b = boil(seed);
  g.save(); g.translate(b.x, b.y);
  poly(pts, seed, o.amt);
  g.shadowColor = 'rgba(40,25,10,.38)'; g.shadowBlur = o.sb ?? 10; g.shadowOffsetX = 5; g.shadowOffsetY = 8;
  g.fillStyle = color; g.fill(); g.shadowColor = 'transparent';
  g.save(); g.clip(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.28; g.fillStyle = TEX; g.fillRect(-4000, -4000, 9000, 9000); g.restore();
  g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = 2; g.stroke();
  g.restore();
}
function boil(seed) { const tk = tick(); return { x: (rnd(seed * 13 + tk) - 0.5) * 2.4, y: (rnd(seed * 17 + tk + 5) - 0.5) * 2.4 }; }
function pop(t0, x, y, fn, dur) {  // la pieza "cae" sobre la mesa
  const p = back((NOW - t0) / (dur || 0.35)); if (p <= 0) return;
  g.save(); g.translate(x, y); g.scale(p, p); g.rotate((1 - Math.min(1, p)) * 0.25); g.translate(-x, -y); fn(); g.restore();
}
function fondo(col) {
  g.fillStyle = col || C.crema; g.fillRect(0, 0, W, H);
  g.save(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.35; g.fillStyle = TEX; g.fillRect(0, 0, W, H); g.restore();
  const v = g.createRadialGradient(W / 2, H * 0.5, H * 0.3, W / 2, H * 0.5, H * 0.75); v.addColorStop(0, 'rgba(60,35,15,0)'); v.addColorStop(1, 'rgba(60,35,15,.35)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
}
function suelo(y, col, seed) { papel([[-20, y], [W + 20, y - 10], [W + 20, H + 20], [-20, H + 20]], col || C.kraft, seed || 900, { amt: 6 }); }
function texto(txt, x, y, size, col, font) { g.save(); g.font = `${font || 800} ${size}px ${font === 400 ? 'MR' : 'MB'}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = col || '#222'; g.fillText(txt, x, y); g.restore(); }
function cartel(txt, x, y, col, size, seed, tc) {  // tira de papel con texto
  g.save(); g.font = `800 ${size || 46}px MB`; const w = g.measureText(txt).width + 50, h = (size || 46) * 1.7; g.restore();
  papel(rectP(x - w / 2, y - h / 2, w, h), col || C.blanco, seed || 77, { amt: 2.5 }); texto(txt, x + boil(seed || 77).x, y + 3 + boil(seed || 77).y, size || 46, tc || '#222');
}
function cinta(x, y, a) { g.save(); g.translate(x, y); g.rotate(a || -0.2); g.fillStyle = 'rgba(240,230,200,.75)'; g.fillRect(-45, -16, 90, 32); g.restore(); }

// ---------- personaje de papel genérico ----------
// o: {cam, pan, pose: stand|pull|tug|sit|walk|arms|offer|ask, venda, lean, fase, triste, mira}
function fig(x, y, h, o, seed) {
  o = o || {}; const u = h / 10, s = seed || 1, f = o.fase || 0, cam = o.cam || C.teal, pan = o.pan || C.marino;
  g.save(); g.translate(x, y); g.rotate(o.lean || 0); if (o.mira < 0) g.scale(-1, 1);
  g.fillStyle = 'rgba(40,25,10,.18)'; g.beginPath(); g.ellipse(0, 0, u * 2, u * 0.4, 0, 0, 7); g.fill();
  const limb = (px, py, len, wd, ang, col, sd) => { g.save(); g.translate(px, py); g.rotate(ang); papel(rectP(-wd / 2, 0, wd, len), col, s * 10 + sd, { amt: 2, sb: 6 }); g.restore(); };
  const sit = o.pose === 'sit', hip = sit ? -3.2 * u : -4.5 * u;
  let l1 = 0, l2 = 0; if (o.pose === 'walk') { l1 = 0.45 * Math.sin(f); l2 = -l1; } if (o.pose === 'pull' || o.pose === 'tug') { l1 = 0.45; l2 = 0.1; }
  if (sit) { limb(-0.6 * u, hip, 2.4 * u, 0.95 * u, -1.5, pan, 1); limb(0.6 * u, hip, 2.4 * u, 0.95 * u, -1.5, pan, 2); limb(2.4 * u, hip, 3.2 * u, 0.95 * u, 0, pan, 3); limb(2.9 * u, hip, 3.2 * u, 0.95 * u, 0, pan, 4); }
  else { limb(-0.6 * u, hip, 4.5 * u, 1 * u, l1, pan, 1); limb(0.6 * u, hip, 4.5 * u, 1 * u, l2, pan, 2); }
  const top = hip - 3.7 * u;
  let a1 = 0.18, a2 = -0.18;
  if (o.pose === 'arms') { a1 = 2.6; a2 = -2.6; }
  if (o.pose === 'pull' || o.pose === 'tug') { a1 = -1.35 + 0.05 * Math.sin(f); a2 = -1.55 + 0.05 * Math.sin(f); }
  if (o.pose === 'offer') { a1 = 0.2; a2 = -1.2; }
  if (o.pose === 'ask') { a1 = 0.2; a2 = -2.2 + 0.15 * Math.sin(f * 2); }
  if (o.pose === 'walk') { a1 = -0.4 * Math.sin(f); a2 = 0.4 * Math.sin(f); }
  if (o.triste) { a1 = 0.05; a2 = -0.05; }
  limb(-1.45 * u, top + 0.4 * u, 3.4 * u, 0.8 * u, a1, cam, 5);
  papel([[-1.6 * u, top], [1.6 * u, top], [1.35 * u, hip + 0.3 * u], [-1.35 * u, hip + 0.3 * u]], cam, s * 10 + 6, { amt: 2.5 });
  limb(1.45 * u, top + 0.4 * u, 3.4 * u, 0.8 * u, a2, cam, 7);
  const hy = top - 1.25 * u + (o.triste ? 0.35 * u : 0), hx = o.triste ? 0.3 * u : 0, pc = o.canas ? '#D6D2CA' : (o.pelo || C.pelo);
  if (o.largo) papel(rectP(hx - 1.32 * u, hy - 0.5 * u, 2.64 * u, 2.3 * u), pc, s * 10 + 13, { amt: 2, sb: 3 });
  papel(circP(hx, hy, 1.15 * u), o.piel || C.piel, s * 10 + 8, { amt: 2 });
  papel([...circP(hx, hy - 0.15 * u, 1.18 * u, 20).filter(p => p[1] < hy - 0.25 * u)], pc, s * 10 + 9, { amt: 2, sb: 3 });
  const b = boil(s * 10 + 8); g.save(); g.translate(b.x + hx, b.y + hy);
  if (o.venda) { papel(rectP(-1.3 * u, -0.45 * u, 2.6 * u, 0.6 * u), C.rojo, s * 10 + 11, { amt: 1.5, sb: 3 }); papel([[1.1 * u, -0.3 * u], [1.9 * u, 0.4 * u], [1.6 * u, 0.6 * u], [1.0 * u, 0.0]], C.rojo, s * 10 + 12, { amt: 1, sb: 3 }); }
  else { g.fillStyle = '#2A1E16'; const ey = o.triste ? 0.05 * u : -0.1 * u; g.beginPath(); g.arc(-0.42 * u, ey, 0.12 * u, 0, 7); g.arc(0.42 * u, ey, 0.12 * u, 0, 7); g.fill(); }
  g.strokeStyle = '#7A3B26'; g.lineWidth = u * 0.12; g.lineCap = 'round'; g.beginPath();
  if (o.triste) g.arc(0, 0.75 * u, 0.32 * u, Math.PI * 1.2, Math.PI * 1.8); else g.arc(0, 0.25 * u, 0.32 * u, 0.25, Math.PI - 0.25); g.stroke();
  g.restore();
  if (o.astro) { g.save(); g.globalAlpha = 0.3; g.fillStyle = '#CFE8FF'; g.beginPath(); g.arc(hx, hy, 1.7 * u, 0, 7); g.fill(); g.globalAlpha = 0.9; g.strokeStyle = '#F2F2EE'; g.lineWidth = 0.28 * u; g.stroke(); g.restore(); }
  g.restore();
}
function burbuja(x, y, r, txt, col, seed, cola) {
  papel(circP(x, y, r), col || C.blanco, seed, { amt: 3 }); if (cola) papel([[x - r * 0.3, y + r * 0.8], [x + cola * r * 0.9, y + r * 1.35], [x + r * 0.15, y + r * 0.85]], col || C.blanco, seed + 1, { amt: 2, sb: 4 });
  if (txt) texto(txt, x, y + 4, r * 0.75, '#222');
}
function petalo(x, y, a, L, Wd, col, sd) { const p = []; for (let k = 0; k < 18; k++) { const u = k / 18 * 6.2832, px = Math.cos(u) * L / 2 + L / 2, py = Math.sin(u) * Wd / 2 * (1 - 0.55 * Math.cos(u)); p.push([x + px * Math.cos(a) - py * Math.sin(a), y + px * Math.sin(a) + py * Math.cos(a)]); } papel(p, col, sd, { amt: 2 }); }
function nochebuena(x, y, s, col, sd, t) { const n = 8, r = (t || 0) * 0.15; for (let k = 0; k < n; k++) petalo(x, y, k / n * 6.2832 + 0.2 + r * 0, 120 * s, 46 * s, '#2F6B3A', sd + k); for (let k = 0; k < n; k++) petalo(x, y, k / n * 6.2832 + 0.6, 95 * s, 40 * s, col || '#C8202E', sd + 10 + k); for (let k = 0; k < 6; k++) papel(circP(x + 13 * s * Math.cos(k), y + 13 * s * Math.sin(k), 7 * s), '#F2C14E', sd + 20 + k, { amt: 1, sb: 2 }); }
function corazon(x, y, s, col, seed) { const p = []; for (let k = 0; k < 40; k++) { const a = k / 40 * 6.2832; p.push([x + s * 16 * Math.pow(Math.sin(a), 3) / 16, y - s * (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 16]); } papel(p, col || C.coral, seed || 55, { amt: 2.5 }); }
function nube(x, y, s, col, seed) { [[0, 0, 1], [-0.9, 0.25, 0.7], [0.9, 0.25, 0.75], [0.35, -0.45, 0.7]].forEach(([dx, dy, r], k) => papel(circP(x + dx * s, y + dy * s, r * s), col || C.gris, (seed || 60) + k, { amt: 3 })); }
function cuerda(x1, y1, x2, y2, seed) { const n = 14; g.save(); g.strokeStyle = '#8A5A2B'; g.lineWidth = 12; g.lineCap = 'round'; g.shadowColor = 'rgba(40,25,10,.35)'; g.shadowOffsetY = 6; g.shadowBlur = 6; g.beginPath();
  for (let k = 0; k <= n; k++) { const f = k / n, x = lerp(x1, x2, f), y = lerp(y1, y2, f) + Math.sin(f * Math.PI) * 18 + (rnd(seed + k + tick() % 3) - 0.5) * 3; k ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); g.restore(); }

// ---------- subtítulos en tiras de papel ----------
function palabras(i) {
  const out = [];
  for (const se of T.scenes[i].sents) { const ws = se.text.split(/\s+/).filter(Boolean), tot = ws.reduce((a, w) => a + w.length + 2, 0); let acc = 0;
    for (const w of ws) { const a = se.start + (acc / tot) * (se.end - se.start); acc += w.length + 2; out.push({ w, a, b: se.start + (acc / tot) * (se.end - se.start) }); } }
  return out;
}
const PAL = {};
function subtitulos(i, t) {
  const ws = PAL[i] || (PAL[i] = palabras(i)); if (!ws.length || t < ws[0].a - 0.05) return;
  let k = ws.findIndex(w => t < w.b); if (k < 0) k = ws.length - 1;
  g.font = '800 60px MB'; g.textBaseline = 'middle';
  if (!ws.grp) { ws.grp = []; let cur = 0, n = 0;
    ws.forEach((w, j) => { const wd = g.measureText(w.w).width + 18; if (n >= 4 || (n && cur + wd > 900)) { cur = 0; n = 0; } if (!n) ws.grp.push(j); cur += wd; n++; ws[j].g = ws.grp.length - 1; }); }
  const gi = ws[k].g, g0 = ws.grp[gi], grp = ws.slice(g0, gi + 1 < ws.grp.length ? ws.grp[gi + 1] : ws.length), y = HZ ? H - 92 : 310, sp = 18;
  const wd = grp.map(w => g.measureText(w.w).width), tw = wd.reduce((a, b) => a + b, 0) + sp * (grp.length - 1);
  papel(rectP(W / 2 - tw / 2 - 34, y - 56, tw + 68, 112), C.blanco, 400 + gi, { amt: 3 }); cinta(W / 2 - tw / 2 - 20, y - 52, -0.3); cinta(W / 2 + tw / 2 + 20, y - 52, 0.3);
  let x = W / 2 - tw / 2;
  grp.forEach((w, j) => { const on = g0 + j === k, dim = g0 + j > k;
    if (on) { const p = ease((t - w.a) / 0.15); g.save(); g.globalAlpha = 0.85; g.fillStyle = OR; g.beginPath(); g.moveTo(x - 8, y + 30); g.lineTo(x - 8 + (wd[j] + 16) * p, y + 26); g.lineTo(x - 8 + (wd[j] + 16) * p, y - 30); g.lineTo(x - 8, y - 26); g.fill(); g.restore(); }
    g.font = '800 60px MB'; g.textAlign = 'left'; g.fillStyle = dim ? 'rgba(30,30,30,.32)' : '#1E1E1E'; g.fillText(w.w, x, y + 3); x += wd[j] + sp; });
}

// ---------- escenas ----------
const V = {};
const D = i => winEnd(i) - T.cuts[i];
V.jalar = (i, r, t) => {
  fondo(C.crema); suelo(1500, C.kraft);
  papel([[600, 1500], [700, 1380], [860, 1360], [960, 1500]], C.gris, 31, { amt: 6 });  // piedra
  fig(780, 1440, 380, { cam: C.mostaza, pan: C.marino }, 2);
  const tir = Math.sin(t * 7) * 0.04; cuerda(380, 1150, 710, 1180, 5);
  fig(300, 1500, 400, { cam: C.teal, pan: C.marino, pose: 'pull', lean: -0.32 + tir, fase: t * 6 }, 1);
  if (r > 0.8) pop(T.cuts[i] + 0.8, 360, 900, () => burbuja(360, 900, 90, '¡!', C.blanco, 81, 0.3));
};
V.venda = (i, r, t) => {
  fondo(C.crema); suelo(1520, C.kraft);
  fig(380, 1520, 470, { cam: C.mostaza, pan: C.marino, venda: true }, 2);
  const t1 = sentAt(i, 0, 0.35);
  pop(t1, 780, 1300, () => { papel([[620, 1520], [650, 1290], [760, 1180], [900, 1210], [960, 1520]], C.rojo, 32, { amt: 5 }); g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 5; g.beginPath(); g.moveTo(780, 1210); g.lineTo(760, 1320); g.lineTo(800, 1400); g.stroke(); }, 0.45);
  pop(t1 + 0.4, 790, 1080, () => cartel('PROBLEMA', 790, 1080, C.blanco, 44, 33, C.rojo), 0.3);
};
V.escalera = (i, r, t) => {
  fondo(C.crema);
  const et = ['PRECONTEMPLACIÓN', 'CONTEMPLACIÓN', 'PREPARACIÓN', 'ACCIÓN', 'MANTENIMIENTO'], cols = [C.coral, C.mostaza, C.verde, C.teal, C.marino];
  const t0 = T.cuts[i] + 0.3, paso = Math.min(0.55, (sentAt(i, 0, 1) - t0) / 5);
  et.forEach((e, k) => { const x = 90 + k * 175, y = 1330 - k * 120, hh = 1700 - y;
    pop(t0 + k * paso, x + 85, y, () => { papel(rectP(x, y, 175, hh), cols[k], 40 + k, { amt: 3 });
      g.save(); g.translate(x + 87 + boil(40 + k).x, y + 90 + (hh - 90) / 2); g.rotate(-Math.PI / 2); g.font = '800 34px MB'; { const m = g.measureText(e).width, f = Math.min(34, 34 * (hh - 120) / m); g.font = `800 ${f}px MB`; } g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#FFF8EC'; g.fillText(e, 0, 0); g.restore();
      texto(String(k + 1), x + 87, y + 46, 54, '#FFF8EC'); }, 0.35); });
  g.save(); g.translate(0, 0); g.restore();
  const t2 = sentAt(i, 1, 0);
  if (t > t2) { const p = ease((t - t2) / 0.4); g.save(); g.globalAlpha = p; g.strokeStyle = OR; g.lineWidth = 10; g.setLineDash([22, 14]); g.strokeRect(70, 1310, 215, 410); g.restore(); }
  fig(177, 1330, 300, { cam: C.mostaza, pan: C.marino, venda: t > t2 }, 2);
};
V.rebote = (i, r, t) => {
  fondo(C.crema); suelo(1560, C.kraft);
  fig(220, 1560, 420, { cam: C.teal, pan: C.marino, pose: 'ask', fase: t * 3 }, 1);
  papel(rectP(560, 760, 90, 800), C.gris, 34, { amt: 4 });  // muro
  for (let y = 790; y < 1540; y += 70) { g.strokeStyle = 'rgba(0,0,0,.15)'; g.lineWidth = 3; g.beginPath(); g.moveTo(565, y); g.lineTo(645, y); g.stroke(); }

const SAM = { cam: '#26344D', pan: '#3B3B44', pelo: '#1E1A18' };
function samurai(x, y, h, o, sd) {  // figura de papel con moño, haori y katana (genérica)
  o = o || {}; const u = h / 10; g.save(); g.translate(x, y); g.rotate(o.lean || 0);
  papel(rectP(-1.9 * u, -4.9 * u, 3.8 * u, 2.6 * u), o.pan || '#3B3B44', (sd || 1500) + 1, { amt: 2 });  // hakama
  g.restore(); fig(x, y, h, { ...SAM, ...o }, sd || 15);
  g.save(); g.translate(x, y); g.rotate(o.lean || 0);
  papel(circP(0, -10.75 * u, 0.42 * u), '#1E1A18', (sd || 1500) + 2, { amt: 1, sb: 3 });  // moño
  g.save(); g.translate(1.2 * u, -4.7 * u); g.rotate(-0.55); papel(rectP(-0.16 * u, -0.2 * u, 0.32 * u, 5.4 * u), '#2A2A2A', (sd || 1500) + 3, { amt: 1, sb: 4 }); papel(rectP(-0.45 * u, 1.2 * u, 0.9 * u, 0.22 * u), C.mostaza, (sd || 1500) + 4, { amt: 1, sb: 2 }); g.restore();
  g.restore(); }

// ---- V2.arma: escena armada con datos (sc.arma) para no escribir una función por tema ----

const ATC = c => (c === 'blanco' || c === 'mostaza' || !c) ? '#222' : '#FFF8EC';
function aAt(i, o, k) { return o.s !== undefined ? sentAt(i, o.s, o.f || 0) : T.cuts[i] + 0.3 + (k || 0) * 0.35; }
function panP(x, y, s, sd) { papel(ellP(x, y, 70 * s, 38 * s, 22), '#C98A4A', sd, { amt: 2, sb: 4 }); for (let k = 0; k < 3; k++) papel(rectP(x - 40 * s + k * 30 * s, y - 20 * s, 8 * s, 26 * s), '#A86A34', sd + 1 + k, { amt: 1, sb: 0 }); }
function pezP(x, y, s, sd) { papel(ellP(x, y, 70 * s, 30 * s, 22), '#7FA6B8', sd, { amt: 2, sb: 4 }); papel([[x + 60 * s, y], [x + 105 * s, y - 32 * s], [x + 105 * s, y + 32 * s]], '#6A92A6', sd + 1, { amt: 1.5, sb: 3 }); g.fillStyle = '#222'; g.beginPath(); g.arc(x - 40 * s, y - 6 * s, 5 * s, 0, 7); g.fill(); }
function guantesP(x, y, h, o, sd) { const u = h / 10, top = (o.pose === 'sit' ? -3.2 : -4.5) * u - 3.7 * u, P = { stand: [0.18, -0.18], arms: [2.6, -2.6], ask: [0.2, -2.2], offer: [0.2, -1.2] }[o.pose || 'stand'] || [0.18, -0.18];
  const L = 3.4 * u, m = o.mira < 0 ? -1 : 1; [[-1.45 * u, P[0]], [1.45 * u, P[1]]].forEach(([px, a], k) => { const hx = px - L * Math.sin(a), hy = top + 0.4 * u + L * Math.cos(a); g.save(); g.translate(x, y); g.rotate(o.lean || 0); papel(circP(m * hx, hy, 0.62 * u), '#C8423A', sd + k, { amt: 1.5, sb: 4 }); g.restore(); }); }
V2.arma = (i, r, t) => {
  const A = S.scenes[i].arma || {}, fd = A.fondo || 'dia';
  if (fd === 'dia') dia(t); else if (fd === 'noche') { noche(t); tierra(840, '#2A3048'); }
  else if (fd === 'atardecer') { cielo('#F6B97A', '#C47A4E'); papel(circP(780, 520, 120), '#FFD9A0', 2600, { amt: 2, sb: 0 }); tierra(840, '#8E6A3E'); }
  else if (fd === 'amanecer') { cielo('#F7DCA8', '#E8A86A'); papel(circP(840, 170, 90), '#FFE6A0', 2601, { amt: 2, sb: 0 }); tierra(860, C.kraft); }
  else if (fd === 'interior') { cielo('#E9E1D0', '#D3C4A6'); tierra(840, '#B08A5E'); }
  else if (fd === 'campo') { cielo('#F2DDB0', '#E3B97A'); papel(ellP(250, 860, 420, 160, 30), '#B8A060', 2602, { amt: 4 }); papel(ellP(800, 870, 400, 140, 30), '#A8925A', 2603, { amt: 4 }); tierra(840, '#C9B070'); }
  else if (fd === 'ciudad') { cielo('#B9C6CE', '#8FA2AE'); for (let k = 0; k < 7; k++) { const h = 260 + rnd(k + 3) * 300; papel(rectP(-60 + k * 160, 840 - h, 140, h), ['#6E6A64', '#7D786F', '#5E5A55'][k % 3], 2610 + k, { amt: 3 });
      for (let j = 0; j < 4; j++) if (rnd(k * 7 + j) > 0.4) papel(rectP(-30 + k * 160, 840 - h + 40 + j * 60, 30, 30), '#E8D8A0', 2620 + k * 4 + j, { amt: 1, sb: 0 }); } tierra(840, '#8C8C88'); }
  else if (fd === 'ring') { cielo('#15182A', '#262C44'); const gl = g.createRadialGradient(500, 300, 20, 500, 600, 620); gl.addColorStop(0, 'rgba(255,240,200,.5)'); gl.addColorStop(1, 'rgba(255,240,200,0)'); g.fillStyle = gl; g.fillRect(-500, -500, 2000, 2000);
    for (let k = 0; k < 16; k++) { const x = -40 + k * 70; papel(circP(x, 600 + (k % 2) * 20, 34), '#0C0E18', 2640 + k, { amt: 2, sb: 0 }); papel(rectP(x - 40, 620 + (k % 2) * 20, 80, 120), '#0C0E18', 2660 + k, { amt: 2, sb: 0 }); }
    papel(rectP(-200, 720, 1400, 400), '#D9D6CC', 2680, { amt: 4 }); papel(rectP(-200, 840, 1400, 60), '#26344D', 2681, { amt: 3 });
    papel(rectP(60, 470, 26, 380), '#C8423A', 2682, { amt: 1.5 }); papel(rectP(914, 470, 26, 380), '#2F6F73', 2683, { amt: 1.5 }); }
  if (A.luz) { const gl = g.createRadialGradient(500, 520, 20, 500, 520, 520); gl.addColorStop(0, 'rgba(255,225,140,.55)'); gl.addColorStop(1, 'rgba(255,225,140,0)'); g.fillStyle = gl; g.fillRect(-500, -500, 2000, 2000); }
  (A.props || []).forEach((p, k) => { const t0 = aAt(i, p, k), s = p.s_ || 1, sd = 2700 + k * 10; if (t < t0) return;
    pop(t0, p.x, p.y, () => {
      if (p.k === 'pan') panP(p.x, p.y, s, sd); else if (p.k === 'pez') pezP(p.x, p.y, s, sd); else if (p.k === 'roca') roca(p.x, p.y, s, sd);

      else if (p.k === 'maceta') { papel([[p.x - 70 * s, p.y - 90 * s], [p.x + 70 * s, p.y - 90 * s], [p.x + 52 * s, p.y], [p.x - 52 * s, p.y]], '#B5562F', sd, { amt: 2 }); papel(rectP(p.x - 80 * s, p.y - 110 * s, 160 * s, 26 * s), '#C8683D', sd + 1, { amt: 1.5 }); nochebuena(p.x, p.y - 150 * s, 0.8 * s, p.color, sd + 2, t); }
      else if (p.k === 'corazon') corazon(p.x, p.y, 60 * s, C.coral, sd); else if (p.k === 'luna') papel(circP(p.x, p.y, 60 * s), '#F2EBCF', sd, { amt: 2, sb: 20 }); else if (p.k === 'sol') solP(p.x, p.y, 70 * s, t);

      else if (p.k === 'cinturon') { papel(rectP(p.x - 150 * s, p.y - 30 * s, 300 * s, 60 * s), '#8A2A2A', sd, { amt: 2 }); papel(ellP(p.x, p.y, 70 * s, 50 * s, 24), C.mostaza, sd + 1, { amt: 2 }); papel(circP(p.x, p.y, 26 * s), '#F2C14E', sd + 2, { amt: 1, sb: 2 }); }
      else if (p.k === 'campana') { papel([[p.x - 50 * s, p.y], [p.x - 36 * s, p.y - 70 * s], [p.x + 36 * s, p.y - 70 * s], [p.x + 50 * s, p.y]], C.mostaza, sd, { amt: 2 }); papel(circP(p.x, p.y + 8 * s, 12 * s), '#8A5A2B', sd + 1, { amt: 1, sb: 2 }); }
      else if (p.k === 'escalera') { const n = p.n || 6; for (let j = 0; j < n; j++) papel(rectP(p.x + j * 90 * s, p.y - (j + 1) * 60 * s, (n - j) * 90 * s + 400, 60 * s + 2), j % 2 ? '#D8CCB0' : '#E6DCC4', sd + j, { amt: 2 }); }

      else if (p.k === 'gente') { const n = p.n || 8; for (let j = 0; j < n; j++) fig(p.x + j * (p.dx || 90), p.y, (p.h || 200), { cam: [C.teal, C.coral, C.marino, C.verde, C.mostaza, '#6A4A8A'][j % 6], pan: '#4A3A2A', pose: p.pose || ((Math.floor(t * 3) + j) % 2 ? 'arms' : 'stand') }, 2780 + j); }
      else if (p.k === 'lista') { g.save(); g.translate(p.x, p.y); g.rotate(-0.03); const it = p.items || [], hh = 140 + it.length * 95; papel(rectP(-280, -hh / 2, 560, hh), C.blanco, sd, { amt: 3 }); papel(rectP(-280, -hh / 2, 560, 100), C.teal, sd + 1, { amt: 2, sb: 3 }); texto(p.titulo || '', 0, -hh / 2 + 50, 46, '#FFF8EC');
        it.forEach((w, j) => { const y = -hh / 2 + 160 + j * 95, tj = p.s !== undefined ? t0 + 0.5 + j * 0.7 : T.cuts[i] + 0.8 + j * 0.7; papel(rectP(-240, y - 30, 60, 60), '#EFE6D2', sd + 2 + j, { amt: 1, sb: 2 }); texto(w, 40, y + 2, 36, '#333');
          if (t > tj) { g.strokeStyle = OR; g.lineWidth = 10; g.beginPath(); g.moveTo(-228, y); g.lineTo(-212, y + 18); g.lineTo(-185, y - 22); g.stroke(); } }); g.restore(); }
    }, 0.3); });
  (A.figs || []).forEach((f, k) => { const t0 = f.s !== undefined ? sentAt(i, f.s, f.f || 0) : T.cuts[i]; if (t < t0) return; const o = { ...(f.o || {}) }; let x = f.x, y = f.y || 840;
    if (f.camina) { const p = cl((t - t0) / Math.max(0.8, winEnd(i) - t0 - 0.6), 0, 1); x = lerp(f.camina[0], f.camina[1], p); if (p < 1) { o.pose = 'walk'; o.fase = t * 6; } }
    if (f.cae) { const c0 = sentAt(i, f.cae.s || 0, f.cae.f || 0), d = f.cae.dur || 1.4, q = (t - c0) / d; if (q > 0 && q < 1) { o.lean = -1.35 * Math.sin(Math.PI * q) * (q < 0.5 ? 1 : 1); o.triste = q < 0.7; } }
    if (f.sube) { const s0 = sentAt(i, f.sube.s || 0, f.sube.f || 0), n = f.sube.n || 6, p = cl((t - s0) / Math.max(1, winEnd(i) - s0 - 0.5), 0, 1), st = Math.min(n - 1, Math.floor(p * n)); x = f.x + st * 90 * (f.sube.s_ || 1); y = (f.y || 840) - (st + 1) * 60 * (f.sube.s_ || 1); o.pose = p >= 0.97 ? 'arms' : 'walk'; o.fase = t * 6; }

    fig(x, y, f.h || 300, o, 2800 + k); if (f.guantes) guantesP(x, y, f.h || 300, o, 2850 + k * 3); });
  (A.carteles || []).forEach((c, k) => { const t0 = aAt(i, c, k); if (t < t0) return; pop(t0, c.x || 500, c.y, () => cartel(c.t, c.x || 500, c.y, ACOL[c.col] || C.blanco, c.size || 52, 2900 + i * 20 + k, ATC(c.col)), 0.3);
    if (c.tacha) { const t1 = sentAt(i, c.tacha.s || 0, c.tacha.f || 0); if (t > t1) { const p = ease((t - t1) / 0.4); g.save(); g.font = `800 ${c.size || 52}px MB`; const w = g.measureText(c.t).width / 2 + 30; g.restore(); g.save(); g.strokeStyle = C.rojo; g.lineWidth = 12; g.beginPath(); g.moveTo((c.x || 500) - w, c.y + 4); g.lineTo(lerp((c.x || 500) - w, (c.x || 500) + w, p), c.y - 6); g.stroke(); g.restore(); } } });
  const n = A.contador; if (n) { const t0 = aAt(i, n, 0); if (t > t0) { const v = Math.round(lerp(n.de || 0, n.a, ease((t - t0) / (n.dur || 2)))); cartel(`${n.pre || ''}${v}${n.suf || ''}`, n.x || 500, n.y || 200, ACOL[n.col] || OR, n.size || 64, 2990 + i, ATC(n.col || 'or')); } }

function cierre(i, t) {
  const sc = S.scenes[i], r = t - T.cuts[i], L = HZ ? { cx: 960, cy: 560, sz: 780, tx: 964, y1: 950, y2: 1025, q1: 90, q2: 160 } : { cx: 540, cy: 900, sz: 1080, tx: 546, y1: 1530, y2: 1610, q1: 300, q2: 380 };
  g.fillStyle = logoBg; g.fillRect(0, 0, W, H);
  if (logo) { const wp = ease((r - 0.2) / 1.1); if (wp > 0) { g.save(); g.beginPath(); g.moveTo(L.cx, L.cy); g.arc(L.cx, L.cy, L.sz * 0.76, -1.5708, -1.5708 + 6.2832 * wp); g.closePath(); g.clip();
    g.globalAlpha = Math.min(1, wp * 1.5); g.drawImage(logo, L.cx - L.sz / 2, L.cy - L.sz / 2, L.sz, L.sz); g.restore(); } }
  const q = sc.q || ['', ''], a = ease((r - 0.3) / 0.5);
  if (a > 0) { g.save(); g.globalAlpha = a; g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = '800 72px MB'; g.fillText(q[0], W / 2, L.q1); g.font = '400 58px MR'; g.fillText(q[1] || '', W / 2, L.q2); g.restore(); }
  const n1 = ease((r - 1.4) / 0.5);
  if (n1 > 0) { g.save(); g.globalAlpha = n1; g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = '800 72px MB'; g.letterSpacing = '12px'; g.fillText('IMPULSO REAL', L.tx, L.y1 + (1 - n1) * 14); g.restore(); }
  const n2 = ease((r - 1.8) / 0.5);
  if (n2 > 0) { const s = 1 + 0.035 * Math.sin((r - 1.8) * 4) * n2, w = 330, h = 84; g.save(); g.globalAlpha = n2; g.translate(L.tx - 6, L.y2); g.scale(s, s);
    g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, h / 2); g.fillStyle = 'rgba(255,107,61,.14)'; g.fill(); g.lineWidth = 4; g.strokeStyle = OR; g.stroke();
    g.fillStyle = OR; g.font = '600 38px MS'; g.letterSpacing = '4px'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('SEGUIR +', 4, 2); g.restore(); }
}

window.render = function (t) {
  NOW = t; const i = sceneAt(t), sc = S.scenes[i], r = t - T.cuts[i];
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  if (sc.tipo === 'cierre') { cierre(i, t); return; }
  const z = 1 + 0.03 * ease(r / Math.max(1, D(i)));
  g.save(); g.translate(W / 2, H * 0.6); g.scale(z, z); g.translate(-W / 2, -H * 0.6);
  if (V2[sc.vis]) { g.translate(ST.x, ST.y); g.scale(ST.s, ST.s); V2[sc.vis](i, r, t); } else (V[sc.vis] || V.venda)(i, r, t);
  g.restore();
  if (sc.tag) { const p = back((r - 0.15) / 0.35); if (p > 0) { g.save(); g.translate(HZ ? 120 : 150, HZ ? 110 : 520); g.scale(p, p); g.rotate(-0.08); papel(circP(0, 0, 70), OR, 300 + i, { amt: 3 }); texto(sc.tag, 0, 4, 76, '#FFF8EC'); g.restore(); } }
  if (sc.titulo) { const p = back((r - 0.1) / 0.35), ty = HZ ? 80 : 520; if (p > 0) { g.save(); g.translate(W / 2, ty); g.scale(p, p); g.translate(-W / 2, -ty); cartel(sc.titulo, W / 2, ty, C.marino, 48, 310 + i, '#FFF8EC'); g.restore(); } }
  if (window.THUMB && S.thumb) { g.fillStyle = 'rgba(20,14,8,.35)'; g.fillRect(0, 0, W, H); S.thumb.forEach((l, k) => cartel(l, W / 2, (HZ ? 700 : 1180) + k * (HZ ? 175 : 200), k ? OR : C.blanco, HZ ? 104 : 92, 500 + k, k ? '#FFF8EC' : '#1E1E1E')); return; }
  subtitulos(i, t);
  if (r < 0.2 && i > 0) { g.fillStyle = `rgba(244,236,216,${0.6 * (1 - r / 0.2)})`; g.fillRect(0, 0, W, H); }
};
window.frame = t => { window.render(t); return cv.toDataURL('image/jpeg', 0.9).split(',')[1]; };
