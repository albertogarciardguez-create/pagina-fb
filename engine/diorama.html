<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:MB;src:url(fonts/Montserrat-ExtraBold.ttf)}
@font-face{font-family:MR;src:url(fonts/Montserrat-Regular.ttf)}
@font-face{font-family:MS;src:url(fonts/Montserrat-SemiBold.ttf)}
@font-face{font-family:AN;src:url(fonts/anton-latin-400-normal.woff2) format('woff2'),url(fonts/anton-latin-ext-400-normal.woff2) format('woff2')}
@font-face{font-family:BC;font-weight:800;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2'),url(fonts/barlow-condensed-latin-ext-800-normal.woff2) format('woff2')}
@font-face{font-family:LI;font-style:italic;src:url(fonts/Lora-Italic-Variable.ttf)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Plantilla "diorama" de Impulso Real: imágenes fijas estilo stop-motion (plastilina + papel) con cámara,
// "boil" a 12 fps, polvo, grano, viñeta, títulos de dos líneas, dial del logo, puntos de progreso y cierre de marca.
const S = window.STORY, T = window.TIMING, I = window.IMGS || {}, HZ = S.formato === 'horizontal';
const W = HZ ? 1920 : 1080, H = HZ ? 1080 : 1920;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
const OR = '#FF6B3D';
let clips = {}, imgs = {}, logo = null, logoBg = '#0B0B0B', grain = [], vig = null, dust = [];

const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const cl = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = p => { p = cl(p, 0, 1); return 0.5 - 0.5 * Math.cos(Math.PI * p); };

async function load() {
  const L = src => new Promise(r => { if (!src) return r(null); const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
  for (const k in I) imgs[k] = await L(I[k]);
  const CL = window.CLIPS || {};
  for (const k in CL) { clips[k] = []; for (const u of CL[k]) { const f = await L(u); if (f) clips[k].push(f); } }
  logo = await L(window.LOGO);
  if (logo) {
    const c = document.createElement('canvas'); c.width = c.height = 8; const x = c.getContext('2d');
    x.drawImage(logo, 0, 0, 20, 20, 0, 0, 8, 8); const d = x.getImageData(3, 3, 1, 1).data;
    logoBg = `rgb(${d[0]},${d[1]},${d[2]})`;
  }
  for (let k = 0; k < 4; k++) {
    const c = document.createElement('canvas'); c.width = 540; c.height = 960; const x = c.getContext('2d');
    const im = x.createImageData(540, 960);
    for (let j = 0; j < im.data.length; j += 4) { const v = Math.random() * 255; im.data[j] = im.data[j + 1] = im.data[j + 2] = v; im.data[j + 3] = 255; }
    x.putImageData(im, 0, 0); grain.push(c);
  }
  vig = document.createElement('canvas'); vig.width = W; vig.height = H;
  const vx = vig.getContext('2d'), gr = vx.createRadialGradient(W / 2, H * 0.48, H * 0.26, W / 2, H * 0.5, H * 0.74);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.5)'); vx.fillStyle = gr; vx.fillRect(0, 0, W, H);
  for (let k = 0; k < 46; k++) dust.push({ x: rnd(k) * W, y: rnd(k + 50) * H, vx: (rnd(k + 90) - 0.5) * 18, vy: -6 - rnd(k + 130) * 14,
    r: 1.2 + rnd(k + 170) * 2.8, a: 0.16 + rnd(k + 210) * 0.34, ph: rnd(k + 250) * 6.28 });
  await document.fonts.load('800 96px MB'); await document.fonts.load('400 64px MR'); await document.fonts.load('600 40px MS'); await document.fonts.load('80px AN'); await document.fonts.load('800 80px BC'); await document.fonts.load('italic 40px LI');
  window.READY = true;
}

function cam(mv, p, t, k) {
  k = k || S.intensidad || 1;
  const e = ease(p), q = Math.floor(t * 12);                       // "boil" de stop-motion: cambia 12 veces por segundo
  let s = 1.06, dx = (rnd(q) - .5) * 2.4, dy = (rnd(q + 7) - .5) * 2.4, r = (rnd(q + 13) - .5) * 0.0012;
  switch (mv) {
    case 'in': s = 1.05 + 0.10 * k * e; break;
    case 'out': s = 1.06 + 0.10 * k * (1 - e); break;
    case 'right': s = 1.14; dx += (50 - 100 * e) * k; break;            // la cámara viaja a la derecha
    case 'left': s = 1.14; dx += (-50 + 100 * e) * k; break;
    case 'up': s = 1.14; dy += (-80 + 160 * e) * k; break;              // la cámara sube (grúa / tilt arriba)
    case 'down': s = 1.10 + 0.05 * e; dy += (80 - 160 * e) * k; break;  // la cámara baja (descenso al foso)
    case 'shake': s = 1.10 + 0.06 * e; dx += Math.sin(t * 2.1) * 14 + (rnd(q + 3) - .5) * 6; dy += Math.sin(t * 1.7) * 10; r += Math.sin(t * 1.3) * 0.006; break;
    case 'none': s = 1.06; break;
  }
  return { s, dx, dy, r };
}

function drawImg(name, rx, ry, rw, rh, c, foco) {
  const im = typeof name === 'string' ? imgs[name] : name;
  g.save(); g.beginPath(); g.rect(rx, ry, rw, rh); g.clip();
  if (!im) {
    const gr = g.createLinearGradient(0, ry, 0, ry + rh); gr.addColorStop(0, '#D9C7A3'); gr.addColorStop(1, '#9C7E55');
    g.fillStyle = gr; g.fillRect(rx, ry, rw, rh);
    g.fillStyle = 'rgba(60,40,20,.55)'; g.font = '800 72px MB'; g.textAlign = 'center';
    g.fillText('FALTA ' + name.toUpperCase(), rx + rw / 2, ry + rh / 2); g.restore(); return;
  }
  const base = Math.max(rw / im.width, rh / im.height) * c.s, iw = im.width * base, ih = im.height * base;
  const fx = foco ? foco[0] : .5, fy = foco ? foco[1] : .5;
  let x = cl(rx + rw / 2 - iw * fx + c.dx, rx + rw - iw, rx), y = cl(ry + rh / 2 - ih * fy + c.dy, ry + rh - ih, ry);
  g.translate(rx + rw / 2, ry + rh / 2); g.rotate(c.r); g.translate(-(rx + rw / 2), -(ry + rh / 2));
  g.drawImage(im, x, y, iw, ih); g.restore();
}

const sceneAt = t => { let i = 0; T.cuts.forEach((c, k) => { if (t >= c) i = k; }); return i; };
const winEnd = i => i + 1 < T.cuts.length ? T.cuts[i + 1] : T.total;

function drawScene(i, t) {
  const sc = S.scenes[i], a = T.cuts[i], b = winEnd(i), p = (t - a) / (b - a), mv = sc.move || 'in';
  if (sc.split) {
    const half = (H - 6) / 2, p2 = (t - a - 0.5) / Math.max(0.5, b - a - 0.5);
    drawImg(sc.img[0], 0, 0, W, half, cam(mv, p, t, sc.int), sc.foco && sc.foco[0]);
    drawImg(sc.img[1], 0, half + 6, W, half, cam(mv, Math.max(0, p2), t + 0.37, sc.int), sc.foco && sc.foco[1]);
    g.fillStyle = '#E9DCC0'; g.fillRect(0, half, W, 6);
  } else {
    const fr = sc.clip && clips[sc.clip] && clips[sc.clip].length ? clips[sc.clip] : null;  // clip de video: cuadros a 12 fps (se queda en el último)
    const src = fr ? fr[Math.min(fr.length - 1, Math.max(0, Math.floor((t - a) * 12)))] : sc.img[0];
    drawImg(src, 0, 0, W, H, cam(mv, p, t, fr ? Math.min(0.6, sc.int || 1) : sc.int), sc.foco);
  }
}

function fx(t, polvo) {
  g.drawImage(vig, 0, 0);
  if (polvo > 0) {
    const q = Math.floor(t * 12) / 12;
    for (const d of dust) {
      let x = (d.x + d.vx * q + Math.sin(q * 0.8 + d.ph) * 8) % W; if (x < 0) x += W;
      let y = (d.y + d.vy * q) % H; if (y < 0) y += H;
      const R = d.r * 3, gr = g.createRadialGradient(x, y, 0, x, y, R);
      gr.addColorStop(0, `rgba(255,238,205,${d.a * polvo})`); gr.addColorStop(1, 'rgba(255,238,205,0)');
      g.fillStyle = gr; g.fillRect(x - R, y - R, 2 * R, 2 * R);
    }
  }
  g.save(); g.globalAlpha = 0.07; g.globalCompositeOperation = 'overlay';
  g.drawImage(grain[Math.floor(t * 12) % 4], 0, 0, W, H); g.restore();
}

const POS = HZ ? { top: [960, 190, 'center'], high: [960, 150, 'center'], mid: [960, 300, 'center'], topleft: [110, 180, 'left'],
  topright: [1810, 180, 'right'], left: [110, 820, 'left'], lowleft: [110, 900, 'left'], low: [960, 900, 'center'], center: [960, 560, 'center'],
  q: [1400, 330, 'center'] } : { top: [540, 360, 'center'], topleft: [90, 360, 'left'], topright: [930, 300, 'right'],
  left: [90, 1360, 'left'], center: [540, 900, 'center'], low: [540, 1420, 'center'], high: [540, 230, 'center'], mid: [540, 560, 'center'], lowleft: [90, 1490, 'left'], q: [540, 250, 'center'] };

function fitFont(txt, weight, fam, size, maxW) {
  let s = size; g.font = `${weight} ${s}px ${fam}`;
  while (s > 40 && Math.max(...txt.split('\n').map(l => g.measureText(l).width)) > maxW) { s -= 4; g.font = `${weight} ${s}px ${fam}`; }
  return s;
}

function title(tt, t, t0, t1) {
  const k = ease((t - t0) / 0.45), out = 1 - ease((t - (t1 - 0.3)) / 0.3), al = Math.min(k, out);
  if (t < t0 || al <= 0) return;
  const [x, y00, align] = POS[tt.pos || 'top'], y0 = y00 + (CHIP && y00 < (HZ ? 260 : 420) ? (HZ ? 90 : 130) : 0), y = y0 + (1 - k) * 14, maxW = HZ ? (tt.pos === 'q' ? 900 : align === 'center' ? 1500 : 1100) : align === 'center' ? 780 : 840;
  g.save(); g.globalAlpha = al; g.textAlign = align; if (k < 1) g.filter = `blur(${(1 - k) * 8}px)`;
  const arena = tt.color === 'arena';
  const bs = fitFont(tt.b, 800, 'MB', tt.big ? 150 : 96, maxW);
  g.shadowColor = arena ? 'rgba(255,244,222,.6)' : 'rgba(0,0,0,.55)'; g.shadowBlur = arena ? 16 : 22; g.shadowOffsetY = arena ? 0 : 3;
  g.fillStyle = arena ? '#7A5A3A' : '#FFFFFF';
  const lines = tt.b.split('\n');
  if (tt.caja) {  // banda oscura translúcida detrás del título para fondos claros o cargados
    const ls0 = tt.l ? fitFont(tt.l, 400, 'MR', 64, maxW) : 0; g.font = `800 ${bs}px MB`;
    const wd = Math.max(...lines.map(l => g.measureText(l).width), tt.l ? (g.font = `400 ${ls0}px MR`, g.measureText(tt.l).width) : 0) + 80;
    const x0 = align === 'center' ? x - wd / 2 : align === 'right' ? x - wd + 40 : x - 40, top = y - bs * 0.95, ht = (lines.length) * bs * 1.02 + (tt.l ? ls0 * 1.3 : 0) + bs * 0.35;
    g.save(); g.shadowColor = 'transparent'; g.filter = 'none'; g.fillStyle = 'rgba(18,12,8,0.5)'; g.beginPath(); g.roundRect(x0, top, wd, ht, 26); g.fill(); g.restore();
    g.font = `800 ${bs}px MB`; g.fillStyle = '#FFFFFF'; g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 22; g.shadowOffsetY = 3;
  }
  lines.forEach((l, j) => g.fillText(l, x, y + j * bs * 1.02));
  if (tt.l) {
    const ls = fitFont(tt.l, 400, 'MR', 64, maxW);
    if (arena && !tt.caja) { g.shadowColor = 'rgba(255,244,222,.6)'; g.shadowBlur = 14; g.shadowOffsetY = 0; g.fillStyle = '#5A4128'; } else { g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 20; g.shadowOffsetY = 3; g.fillStyle = '#FFFFFF'; }
    g.fillText(tt.l, x, y + (lines.length - 1) * bs * 1.02 + ls * 1.18);
  }
  g.restore();
}

function dial(d, t, t0, t1) {
  const k = ease((t - t0) / 0.35), out = 1 - ease((t - (t1 - 0.3)) / 0.3), al = Math.min(k, out);
  if (t < t0 || al <= 0) return;
  const cx = d.x || W / 2, cy = d.y || (HZ ? 520 : 820), R = d.r || 230, sc = 0.92 + 0.08 * k;
  g.save(); g.globalAlpha = al; g.translate(cx, cy); g.scale(sc, sc);
  g.fillStyle = 'rgba(14,14,15,.74)'; g.beginPath(); g.arc(0, 0, R * 1.18, 0, 6.2832); g.fill();
  const fill = d.tipo === 'dias' ? ease((t - t0 - 0.2) / (d.dur || 2.0)) : 0, lit = Math.round(fill * (d.n || 30));
  const hand = d.tipo === 'noche' ? (t - t0) / (d.vuelta || 3.0) * 6.2832 : null;
  g.lineCap = 'round';
  for (let j = 0; j < 60; j++) {
    const a = j / 60 * 6.2832 - 1.5708, maj = j % 5 === 0, L = maj ? R * 0.14 : R * 0.08;
    let col = maj ? 'rgba(236,233,227,.95)' : 'rgba(236,233,227,.5)';
    if (d.tipo === 'dias' && j < lit) col = OR;
    if (hand !== null) { let df = (hand % 6.2832) - j / 60 * 6.2832; if (df < 0) df += 6.2832; if (df < 1.3) col = `rgba(255,107,61,${(1 - df / 1.3).toFixed(3)})`; }
    g.strokeStyle = col; g.lineWidth = maj ? 5 : 2.5;
    g.beginPath(); g.moveTo(Math.cos(a) * (R - L), Math.sin(a) * (R - L)); g.lineTo(Math.cos(a) * R, Math.sin(a) * R); g.stroke();
  }
  g.strokeStyle = 'rgba(110,110,115,.9)'; g.lineWidth = 7; g.beginPath(); g.arc(0, 0, R * 0.72, 0, 6.2832); g.stroke();
  g.textAlign = 'center';
  if (d.tipo === 'dias') {
    g.fillStyle = '#fff'; g.font = `800 ${Math.round(R * 0.62)}px MB`; g.fillText(String(lit), 0, R * 0.16);
    g.fillStyle = OR; g.font = `600 ${Math.round(R * 0.17)}px MS`; g.letterSpacing = '6px'; g.fillText(d.sub || 'DÍAS', 0, R * 0.46);
  } else {
    const a = hand - 1.5708; g.shadowColor = OR; g.shadowBlur = 18; g.strokeStyle = OR; g.lineWidth = 9;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * R * 0.62, Math.sin(a) * R * 0.62); g.stroke();
    g.shadowBlur = 0; g.fillStyle = '#ECE9E3'; g.beginPath(); g.arc(0, 0, 11, 0, 6.2832); g.fill();
    g.font = `600 ${Math.round(R * 0.15)}px MS`; g.letterSpacing = '6px'; g.fillText(d.sub || 'NOCHE', 0, R * 0.42);
  }
  g.restore();
}

function chip(txt, t, a) {  // etiqueta de año / lugar con punto naranja
  const k = ease((t - a - 0.15) / 0.4); if (k <= 0) return;
  g.save(); g.globalAlpha = k; g.font = '600 34px MS'; g.letterSpacing = '4px';
  const w = g.measureText(txt).width + 86, x = HZ ? 70 : 60, y = HZ ? 56 : 110, h = 64;
  g.translate(-(1 - k) * 40, 0); g.fillStyle = 'rgba(14,14,15,.72)'; g.beginPath(); g.roundRect(x, y, w, h, h / 2); g.fill();
  g.strokeStyle = 'rgba(255,107,61,.8)'; g.lineWidth = 2; g.stroke();
  g.fillStyle = OR; g.shadowColor = OR; g.shadowBlur = 12; g.beginPath(); g.arc(x + 34, y + h / 2, 8 + Math.sin(t * 5) * 1.5, 0, 6.2832); g.fill();
  g.shadowBlur = 0; g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.fillText(txt, x + 56, y + h / 2 + 2); g.restore();
}

function dots(acto) {
  const n = S.actos || 5, y = HZ ? H - 56 : 1640, sp = 36, x0 = W / 2 - sp * (n - 1) / 2;
  g.save();
  for (let k = 0; k < n; k++) {
    const on = k + 1 === acto; g.beginPath(); g.arc(x0 + k * sp, y, on ? 8 : 6, 0, 6.2832);
    g.fillStyle = on ? OR : 'rgba(255,255,255,.55)'; g.shadowColor = on ? OR : 'rgba(0,0,0,.6)'; g.shadowBlur = on ? 16 : 6; g.fill();
  }
  g.restore();
}

function cierre(i, t) {
  const sc = S.scenes[i], a = T.cuts[i], r = t - a, E = T.ev[i];
  const L = HZ ? { cx: 520, cy: 540, sz: 900, tx: 1400, y1: 640, y2: 750 } : { cx: 540, cy: 900, sz: 1080, tx: 546, y1: 1530, y2: 1610 };
  if (i > 0 && S.scenes[i - 1].img) drawScene(i - 1, t);
  g.save(); g.globalAlpha = ease(r / 0.9); g.fillStyle = logoBg; g.fillRect(0, 0, W, H); g.restore();
  if (logo) {
    const wp = ease((r - 0.3) / 1.1);                                // el dial "se cierra" en sentido del reloj
    if (wp > 0) {
      g.save(); g.beginPath(); g.moveTo(L.cx, L.cy); g.arc(L.cx, L.cy, L.sz * 0.76, -1.5708, -1.5708 + 6.2832 * wp); g.closePath(); g.clip();
      g.globalAlpha = Math.min(1, wp * 1.5); g.drawImage(logo, L.cx - L.sz / 2, L.cy - L.sz / 2, L.sz, L.sz); g.restore();
    }
    const pg = ease((r - 1.3) / 0.5);
    if (pg > 0) {
      const pu = 0.55 + 0.45 * Math.sin((r - 1.3) * 3.2), gr = g.createRadialGradient(L.cx, L.cy, 0, L.cx, L.cy, 270);
      gr.addColorStop(0, `rgba(255,107,61,${0.24 * pg * pu})`); gr.addColorStop(1, 'rgba(255,107,61,0)'); g.fillStyle = gr; g.fillRect(L.cx - 270, L.cy - 270, 540, 540);
    }
  }
  (sc.titles || []).forEach((tt, k) => title(tt, t, E.titles[k], T.total + 1));
  const n1 = ease((r - 1.6) / 0.5);
  if (n1 > 0) {
    g.save(); g.globalAlpha = n1; g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = '800 72px MB'; g.letterSpacing = '12px';
    g.fillText('IMPULSO REAL', L.tx, L.y1 + (1 - n1) * 14); g.restore();
  }
  const n2 = ease((r - 2.0) / 0.5);
  if (n2 > 0) {
    const s = 1 + 0.035 * Math.sin((r - 2.0) * 4) * n2, w = 330, h = 84;
    g.save(); g.globalAlpha = n2; g.translate(L.tx - 6, L.y2); g.scale(s, s);
    g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, h / 2); g.fillStyle = 'rgba(255,107,61,.14)'; g.fill();
    g.lineWidth = 4; g.strokeStyle = OR; g.shadowColor = OR; g.shadowBlur = 14; g.stroke();
    g.shadowBlur = 0; g.fillStyle = OR; g.font = '600 38px MS'; g.letterSpacing = '4px'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('SEGUIR +', 4, 2); g.restore();
  }
}

// ---------- escenas "recorte": periódico animado (palabras recortadas, sellos, marcador, cinta) ----------
let PAPEL = null;
function papel() {
  if (PAPEL) return PAPEL;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.fillStyle = '#E9E1CE'; x.fillRect(0, 0, W, H);
  const im = x.getImageData(0, 0, W, H);
  for (let j = 0; j < im.data.length; j += 4) { const v = (Math.random() - 0.5) * 22; im.data[j] += v; im.data[j + 1] += v; im.data[j + 2] += v * 0.8; }
  x.putImageData(im, 0, 0);
  x.fillStyle = 'rgba(40,32,24,.13)';            // columnas de texto falso
  const cols = HZ ? 5 : 3, cw = (W - 120) / cols;
  for (let k = 0; k < cols; k++) for (let y = 300; y < H - 120; y += 22) {
    if (rnd(k * 999 + y) < 0.08) { y += 30; continue; }
    x.fillRect(60 + k * cw + 14, y, (cw - 28) * (0.55 + 0.45 * rnd(y * 7 + k)), 9);
  }
  x.fillStyle = 'rgba(40,32,24,.85)'; x.fillRect(50, 120, W - 100, 6); x.fillRect(50, 240, W - 100, 3);
  x.font = '64px AN'; x.textAlign = 'center'; x.fillStyle = '#2A2118'; x.letterSpacing = '6px'; x.fillText(S.periodico || 'EL DIARIO DEL PROPÓSITO', W / 2, 205);
  x.font = 'italic 26px LI'; x.letterSpacing = '0px'; x.fillText(S.edicion || 'Edición especial', W / 2, 280);
  const v = x.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(60,40,20,.35)');
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  return (PAPEL = c);
}
const ESTILOS = [['#FFFFFF', '#111'], ['#111', '#F4EFE4'], ['#F3D34A', '#111'], ['#FFFFFF', '#C8102E'], ['#E9DFC8', '#111'], ['#C8102E', '#FFF']];
const FUENTES = ['AN', '800 BC', 'AN', 'MB', 'AN'];
function recorte(i, t) {
  const sc = S.scenes[i], a = T.cuts[i], b = winEnd(i), r = t - a, dur = b - a, R0 = sc.recorte || {};
  const q = Math.floor(t * 12), z = 1.02 + 0.03 * ease(r / dur);
  g.save(); g.translate(W / 2, H / 2); g.scale(z, z); g.rotate((rnd(i * 13) - 0.5) * 0.01); g.translate(-W / 2, -H / 2);
  g.drawImage(papel(), 0, 0);
  const lines = (R0.titulo || '').split('|'), words = [];
  lines.forEach((ln, li) => ln.split(' ').filter(Boolean).forEach(w => words.push([w, li])));
  const n = words.length, t0 = 0.15, span = Math.min(dur * 0.55, 0.32 * n + 0.4);
  const bs = R0.tam || (HZ ? 120 : 140), lh = bs * 1.32, y0 = (HZ ? 430 : 800) - (lines.length - 1) * lh / 2;
  const rows = lines.map(() => []); words.forEach((w, k) => rows[w[1]].push(k));
  const pos = [];
  rows.forEach((ks, li) => {
    const ws = ks.map(k => { const f = FUENTES[(k + i) % FUENTES.length]; g.font = (f.includes(' ') ? f.replace(' ', ` ${bs}px `) : `${bs}px ${f}`); return g.measureText(words[k][0]).width + bs * 0.45; });
    let tot = ws.reduce((s, v) => s + v, 0) + 18 * (ks.length - 1), sc2 = Math.min(1, (W - 120) / tot), x = W / 2 - tot * sc2 / 2;
    ks.forEach((k, j) => { pos[k] = [x + ws[j] * sc2 / 2, y0 + li * lh, ws[j] * sc2, sc2]; x += (ws[j] + 18) * sc2; });
  });
  words.forEach(([w, li], k) => {
    const tk = a + t0 + k * span / Math.max(1, n), p = (t - tk) / 0.22; if (p <= 0) return;
    const e = Math.min(1, p), sl = 1 + (1 - e) * 0.9, [cx, cy, ww, s2] = pos[k], st = ESTILOS[(k * 7 + i * 3) % ESTILOS.length];
    const f = FUENTES[(k + i) % FUENTES.length], fs = bs * s2, hh = fs * 1.15, rot = (rnd(k * 31 + i * 7) - 0.5) * 0.12 + (rnd(q + k) - 0.5) * 0.004;
    g.save(); g.translate(cx, cy); g.rotate(rot); g.scale(sl, sl); g.globalAlpha = Math.min(1, p * 2);
    g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 14; g.shadowOffsetY = 6;
    g.fillStyle = st[0]; g.beginPath();                    // recorte con borde irregular
    const hw = ww / 2, hh2 = hh / 2; g.moveTo(-hw, -hh2);
    for (let u = 0; u <= 8; u++) g.lineTo(-hw + ww * u / 8, -hh2 + (rnd(k * 50 + u) - 0.5) * 8);
    for (let u = 0; u <= 4; u++) g.lineTo(hw + (rnd(k * 70 + u) - 0.5) * 8, -hh2 + hh * u / 4);
    for (let u = 8; u >= 0; u--) g.lineTo(-hw + ww * u / 8, hh2 + (rnd(k * 90 + u) - 0.5) * 8);

  const tEnd = a + t0 + span + 0.2;
  if (R0.marca !== undefined && pos[R0.marca]) {           // marcador rojo: círculo dibujado a mano
    const pm = ease((t - tEnd) / 0.6); if (pm > 0) {
      const [cx, cy, ww] = pos[R0.marca]; g.save(); g.strokeStyle = 'rgba(200,16,46,.9)'; g.lineWidth = 9; g.lineCap = 'round'; g.beginPath();
      for (let u = 0; u <= 60 * pm; u++) { const an = -2.2 + u / 60 * 6.6, rr = 1 + 0.06 * Math.sin(u * 0.7); g.lineTo(cx + Math.cos(an) * ww * 0.62 * rr, cy + Math.sin(an) * bs * 0.85 * rr); }
      g.stroke(); g.restore();
    }
  }
  if (R0.sub) {                                             // bajada en máquina de escribir
    const ps = (t - tEnd - 0.1) / 0.8; if (ps > 0) {
      const txt = R0.sub.slice(0, Math.floor(R0.sub.length * Math.min(1, ps))), yS = y0 + (lines.length - 1) * lh + bs * 1.25;
      g.save(); g.font = `italic ${HZ ? 44 : 52}px LI`; g.textAlign = 'center'; const tw = g.measureText(R0.sub).width + 60;
      g.translate(W / 2, yS); g.rotate(-0.012); g.fillStyle = 'rgba(255,253,246,.95)'; g.shadowColor = 'rgba(0,0,0,.25)'; g.shadowBlur = 10;
      g.fillRect(-tw / 2, -50, tw, 84); g.shadowColor = 'transparent'; g.fillStyle = '#2A2118'; g.fillText(txt, 0, 4); g.restore();
    }
  }
  if (R0.lista) R0.lista.forEach((it, k) => {               // lista de recortes pequeños
    const pl = ease((t - tEnd - 0.3 - k * 0.45) / 0.3); if (pl <= 0) return;
    const yL = (HZ ? 720 : 1260) + k * (HZ ? 95 : 120), xL = W / 2 + (k % 2 ? 40 : -40);
    g.save(); g.translate(xL, yL); g.rotate((k % 2 ? 1 : -1) * 0.03); g.globalAlpha = pl; g.font = `${HZ ? 60 : 70}px AN`; const tw = g.measureText(it).width + 70;
    g.fillStyle = '#111'; g.fillRect(-tw / 2, -48, tw, 92); g.fillStyle = '#F3D34A'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(it, 0, 2); g.restore();
  });
  if (R0.sello) {                                           // sello de goma
    const pS = (t - a - (R0.selloAt !== undefined ? R0.selloAt * dur : dur * 0.55)) / 0.18; if (pS > 0) {
      const e2 = Math.min(1, pS), sc3 = 1 + (1 - e2) * 1.4;
      g.save(); g.translate(HZ ? W - 330 : W - 250, HZ ? 860 : 1480); g.rotate(-0.22); g.scale(sc3, sc3); g.globalAlpha = 0.82 * e2;
      g.strokeStyle = '#C8102E'; g.fillStyle = '#C8102E'; g.lineWidth = 8; g.font = '64px AN'; g.textAlign = 'center'; g.textBaseline = 'middle';
      const tw = g.measureText(R0.sello).width + 70; g.strokeRect(-tw / 2, -56, tw, 112); g.lineWidth = 3; g.strokeRect(-tw / 2 + 12, -44, tw - 24, 88);
      g.fillText(R0.sello, 0, 4); g.restore();
    }
  }
  [[90, y0 - 140, 0.6], [W - 110, y0 + (lines.length - 1) * lh + 120, -0.5]].forEach(([x, y, ro], k) => {   // cinta adhesiva
    if (t - a < t0 + 0.3) return; g.save(); g.translate(x, y); g.rotate(ro); g.fillStyle = 'rgba(245,235,200,.55)'; g.fillRect(-70, -22, 140, 44); g.restore();
  });
  g.restore();
}

function capitulo(i, t) {
  const sc = S.scenes[i], a = T.cuts[i], b = winEnd(i), r = t - a, cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.44;
  const out = 1 - ease((t - (b - 0.35)) / 0.35), k = ease(r / 0.9), k1 = ease((r - 0.15) / 0.5), k2 = ease((r - 0.4) / 0.6);
  g.fillStyle = logoBg; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,.035)'; g.lineWidth = 1;
  for (let x = 0; x < W; x += 60) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y < H; y += 60) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.save(); g.globalAlpha = 0.5 * out; g.translate(cx, cy); g.rotate(r * 0.05); g.lineCap = 'round';
  for (let j = 0; j < Math.round(60 * k); j++) {
    const an = j / 60 * 6.2832 - 1.5708, maj = j % 5 === 0, Lg = maj ? R * 0.09 : R * 0.05;
    g.strokeStyle = maj ? 'rgba(236,233,227,.9)' : 'rgba(236,233,227,.45)'; g.lineWidth = maj ? 4 : 2;
    g.beginPath(); g.moveTo(Math.cos(an) * (R - Lg), Math.sin(an) * (R - Lg)); g.lineTo(Math.cos(an) * R, Math.sin(an) * R); g.stroke();
  }
  g.restore();
  const tit = sc.cap_titulo || '', lines = tit.split('\n');
  g.save(); g.textAlign = 'center'; g.globalAlpha = k1 * out; g.fillStyle = OR; g.font = '600 40px MS'; g.letterSpacing = '10px';
  g.fillText(sc.cap || '', cx + 5, cy - 90 + (1 - k1) * 12);
  g.letterSpacing = '0px'; g.globalAlpha = k2 * out; g.fillStyle = '#fff';
  const fs = fitFont(tit, 800, 'MB', HZ ? 110 : 96, W - 240);
  if (k2 < 1) g.filter = `blur(${(1 - k2) * 8}px)`;
  lines.forEach((l, j) => g.fillText(l, cx, cy + 30 + j * fs * 1.05 + (1 - k2) * 14));
  g.filter = 'none'; g.fillStyle = OR; const lw = 180 * k2; g.fillRect(cx - lw / 2, cy + 30 + (lines.length - 1) * fs * 1.05 + 48, lw, 5);
  g.restore();
}

let CHIP = false;
window.render = function (t) {
  const i = sceneAt(t), sc = S.scenes[i], a = T.cuts[i], b = winEnd(i), E = T.ev[i];
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  CHIP = !!sc.chip;
  if (sc.tipo === 'cierre') { cierre(i, t); fx(t, 0); return; }

  if (sc.tipo === 'recorte') { recorte(i, t); fx(t, 0.3); if (sc.chip) chip(sc.chip, t, a); if (sc.acto) dots(sc.acto); return; }
  drawScene(i, t);
  if (sc.fade && i > 0 && S.scenes[i - 1].img && t < a + 0.5) { g.save(); g.globalAlpha = 1 - ease((t - a) / 0.5); drawScene(i - 1, t); g.restore(); }
  fx(t, sc.polvo === undefined ? 1 : sc.polvo);
  if (sc.dial) dial(sc.dial, t, E.dial, b);

load();
