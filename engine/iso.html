</style></head><body><canvas id="c"></canvas>
<script>
// Plantilla "iso" (Señor Fútbol): mundo 3D isométrico dibujado en código, sin imágenes.
//  · vis "explica": escenas armadas con objetos (cancha, gradas, estadio, personas, cajas, cotas, flechas…)

// Mundo en metros: x a lo ancho, y a lo largo, z hacia arriba. Cámara: rot (°, giro), e (°, elevación: 90 = desde arriba),

const S = window.STORY, T = window.TIMING, HZ = S.formato === 'horizontal';
const W = HZ ? 1920 : 1080, H = HZ ? 1080 : 1920;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
const LIME = '#B6E62E', INK = '#141414', CIELO = '#7EC3EE', PASTO = '#86C766';
const EQ = { a: ['#F2762E', '#1E1E1E', '#F2762E'], b: ['#5BB8D9', '#F4F4F4', '#5BB8D9'], po: ['#F2D23A', '#2A2A2A', '#F2D23A'], c: ['#E8473C', '#F4F4F4', '#E8473C'], n: ['#2E5BBA', '#F4F4F4', '#2E5BBA'] };
const PIEL = ['#F1C9A5', '#D9A27A', '#B97A52', '#8A5634', '#E6B48C'];
const GENTE = ['#2E5BBA', '#3E6FD0', '#F2C230', '#E9E9E9', '#2A3F7A', '#F5D35B', '#6E8FD8'];
let logo = null;
const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const cl = (x, a, b) => Math.max(a, Math.min(b, x));

const rad = d => d * Math.PI / 180;
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = (n >> 8) & 255, b = n & 255;

// ---------- lista de dibujo ordenada por profundidad ----------

// figura humana (siempre de frente a la cámara): equipo [camisa, short, medias], escala, fase de carrera

function balon(x, y, z) { const p = P(x, y, z || 0), q = P(x, y, 0), r = Math.max(5, 0.36 * pxM());
  add(p.d + 0.02, () => { g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(q.x, q.y, r, r * 0.4, 0, 0, 6.283); g.fill();
    g.fillStyle = '#fff'; g.strokeStyle = '#222'; g.lineWidth = Math.max(1.5, r * 0.18); g.beginPath(); g.arc(p.x, p.y - r, r, 0, 6.283); g.fill(); g.stroke();

  poly([w(-A / 2 - 3, Lg / 2), w(A / 2 + 3, Lg / 2), w(A / 2 + 3, Lg / 2 + 3), w(-A / 2 - 3, Lg / 2 + 3)].map(q => P(q[0], q[1], 0)), '#5FA84A');

// ---------- fondos ----------
