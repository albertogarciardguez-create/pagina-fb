<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:MB;src:url(fonts/Montserrat-ExtraBold.ttf)}
@font-face{font-family:MR;src:url(fonts/Montserrat-Regular.ttf)}
@font-face{font-family:MS;src:url(fonts/Montserrat-SemiBold.ttf)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Plantilla "infografia" (Impulso Real): historia animada SIN imágenes, todo dibujado en código.
// Personajes genéricos con volumen (sin parecido a nadie), multitudes, contadores, mapas con rutas,
// subtítulos palabra por palabra arriba, brasas, y el cierre de marca. Escenas: {"vis": tipo, "cnt": [...]}.
const S = window.STORY, T = window.TIMING, W = 1080, H = 1920;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const OR = '#FF6B3D', CREAM = '#FFE9B0';
let logo = null, logoBg = '#0B0B0B';
const rnd = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const cl = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = p => { p = cl(p, 0, 1); return 0.5 - 0.5 * Math.cos(Math.PI * p); };
const back = p => { p = cl(p, 0, 1); const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;

async function load() {
  const L = src => new Promise(r => { if (!src) return r(null); const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
  logo = await L(window.LOGO);
  if (logo) { const c = document.createElement('canvas'); c.width = c.height = 8; const x = c.getContext('2d');
    x.drawImage(logo, 0, 0, 20, 20, 0, 0, 8, 8); const d = x.getImageData(3, 3, 1, 1).data; logoBg = `rgb(${d[0]},${d[1]},${d[2]})`; }
  await document.fonts.load('80px MB'); await document.fonts.load('40px MS'); await document.fonts.load('40px MR');
  window.READY = true;
}
const sceneAt = t => { let i = 0; while (i + 1 < T.cuts.length && t >= T.cuts[i + 1]) i++; return i; };
const winEnd = i => i + 1 < T.cuts.length ? T.cuts[i + 1] : T.total;
const sentAt = (i, s, f) => { const ss = T.scenes[i].sents, se = ss[Math.min(s || 0, ss.length - 1)]; return se.start + (f || 0) * (se.end - se.start); };

// ---------- fondos ----------
function fondo(tipo, t) {
  let gr;
  if (tipo === 'mar') {
    gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#2B2350'); gr.addColorStop(0.42, '#E0805A'); gr.addColorStop(0.62, '#FFC27A');
    gr.addColorStop(0.63, '#1E4A6E'); gr.addColorStop(1, '#0B1D33'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.save(); g.globalAlpha = 0.5; g.fillStyle = '#FFE2A8'; g.beginPath(); g.arc(W * 0.68, H * 0.6, 120, Math.PI, 0); g.fill(); g.restore();
    for (let k = 0; k < 26; k++) { const y = H * 0.64 + k * 26, w = 60 + rnd(k) * 220, x = (rnd(k + 9) * W + t * (20 + k * 2)) % (W + 300) - 150;
      g.fillStyle = `rgba(255,214,160,${0.18 - k * 0.006})`; g.fillRect(x, y, w, 4); }
    return;
  }
  if (tipo === 'noche') { gr = g.createRadialGradient(W / 2, H * 0.4, 50, W / 2, H * 0.5, H * 0.8); gr.addColorStop(0, '#1C2A44'); gr.addColorStop(1, '#05070C'); }
  else if (tipo === 'estadio') { gr = g.createRadialGradient(W / 2, H * 0.35, 80, W / 2, H * 0.5, H * 0.85); gr.addColorStop(0, '#2C3A2A'); gr.addColorStop(1, '#070A07'); }
  else { gr = g.createRadialGradient(W / 2, H * 0.45, 60, W / 2, H * 0.5, H * 0.85); gr.addColorStop(0, '#4A2414'); gr.addColorStop(1, '#0C0604'); }
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
function brasas(t, n, col) {
  for (let k = 0; k < n; k++) {
    const sp = 30 + rnd(k) * 70, x = (rnd(k + 3) * W + Math.sin(t * 0.7 + k) * 30), y = H - ((rnd(k + 7) * H + t * sp) % (H + 60));
    const s = 3 + rnd(k + 1) * 7, a = 0.25 + 0.5 * rnd(k + 5) * (0.6 + 0.4 * Math.sin(t * 3 + k));
    g.fillStyle = col ? col(a) : `rgba(255,${140 + (k % 5) * 18},60,${a})`; g.fillRect(x, y, s, s);
  }
}
function tribuna(t, col1, col2, y0, y1) {  // gradas con multitud y flashes
  for (let r = 0; r < 9; r++) {
    const y = lerp(y0, y1, r / 8), sz = lerp(10, 22, r / 8), n = Math.ceil(W / (sz * 1.6)) + 2;
    for (let k = 0; k < n; k++) {
      const x = k * sz * 1.6 + (r % 2) * sz * 0.8 - sz, h = rnd(r * 99 + k), bob = Math.sin(t * 6 + k + r) * sz * 0.12;
      g.fillStyle = h < 0.5 ? col1 : col2; g.globalAlpha = 0.55 + r * 0.05; g.beginPath(); g.arc(x, y + bob, sz * 0.45, 0, 7); g.fill();
      g.fillRect(x - sz * 0.5, y + sz * 0.4 + bob, sz, sz * 0.8);
      if (rnd(k * 7 + r + Math.floor(t * 5)) > 0.992) { g.globalAlpha = 1; g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y + bob, sz * 0.6, 0, 7); g.fill(); }
    }
  }
  g.globalAlpha = 1;
}
function focos(t, xs, y) { for (const x of xs) { const gr = g.createRadialGradient(x, y, 5, x, y, 260); gr.addColorStop(0, 'rgba(255,250,230,.9)'); gr.addColorStop(1, 'rgba(255,250,230,0)'); g.fillStyle = gr; g.fillRect(x - 260, y - 260, 520, 520); } }
function pasto(y) { const gr = g.createLinearGradient(0, y, 0, H); gr.addColorStop(0, '#2F6B2E'); gr.addColorStop(1, '#173A17'); g.fillStyle = gr; g.fillRect(0, y, W, H - y);
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 5; g.beginPath(); g.ellipse(W / 2, y + 260, 360, 90, 0, 0, 7); g.stroke(); }

// ---------- personaje genérico (sin parecido a nadie) ----------
function sombra(x, y, w) { g.save(); g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(x, y, w, w * 0.22, 0, 0, 7); g.fill(); g.restore(); }
function bloque(x, y, w, h, c1, c2, r) { const gr = g.createLinearGradient(x, 0, x + w, 0); gr.addColorStop(0, c2); gr.addColorStop(0.45, c1); gr.addColorStop(1, c2);
  g.fillStyle = gr; g.beginPath(); g.roundRect(x, y, w, h, r || w * 0.3); g.fill(); }
function oscuro(c, k) { const n = parseInt(c.slice(1), 16), f = v => Math.round(v * k); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; }
// o: {camisa, short, medias, num, pose: stand|arms|kick|run|fist, fase, espalda, venda, lagrimas, balon}
function fig(x, y, h, o) {
  o = o || {}; const u = h / 10, cam = o.camisa || '#C8102E', sh = o.short || '#1B1B1B', md = o.medias || cam, piel = '#E0AC7E', pielO = '#B8835A', pelo = '#2A1A12';
  const f = o.fase || 0;
  sombra(x, y, u * 2.2);
  g.save(); g.translate(x, y);
  // piernas
  let la = 0, ra = 0;
  if (o.pose === 'kick') { la = -0.15; ra = -0.25 - 0.9 * Math.max(0, Math.sin(f)); }
  if (o.pose === 'run') { la = 0.5 * Math.sin(f); ra = -0.5 * Math.sin(f); }
  const pierna = (dx, ang, venda) => { g.save(); g.translate(dx, -u * 4.6); g.rotate(ang);
    bloque(-u * 0.55, 0, u * 1.1, u * 2.4, piel, pielO, u * 0.5); if (venda) { g.fillStyle = '#F4F1EA'; g.fillRect(-u * 0.6, u * 1.2, u * 1.2, u * 0.7); }
    bloque(-u * 0.55, u * 2.3, u * 1.1, u * 1.7, md, oscuro(md, 0.65), u * 0.4);
    g.fillStyle = '#111'; g.beginPath(); g.ellipse(u * 0.15, u * 4.1, u * 0.85, u * 0.38, 0, 0, 7); g.fill(); g.restore(); };
  pierna(-u * 0.75, la, false); pierna(u * 0.75, ra, o.venda);
  bloque(-u * 1.6, -u * 5.3, u * 3.2, u * 1.4, sh, oscuro(sh.length === 7 ? sh : '#1B1B1B', 0.6), u * 0.3);
  // brazos
  const brazo = (lado, ang) => { g.save(); g.translate(lado * u * 1.55, -u * 8.2); g.rotate(ang);
    bloque(-u * 0.45, 0, u * 0.9, u * 1.4, cam, oscuro(cam, 0.7), u * 0.4); bloque(-u * 0.4, u * 1.2, u * 0.8, u * 1.8, piel, pielO, u * 0.4);
    g.fillStyle = piel; g.beginPath(); g.arc(0, u * 3.1, u * 0.45, 0, 7); g.fill(); g.restore(); };
  let al = 0.15, ar = -0.15;
  if (o.pose === 'arms') { al = 2.5 + 0.08 * Math.sin(f); ar = -2.5 - 0.08 * Math.sin(f); }
  if (o.pose === 'fist') { al = 0.2; ar = -2.9; }
  if (o.pose === 'run' || o.pose === 'kick') { al = 0.6 * Math.sin(f) + 0.3; ar = -0.6 * Math.sin(f) - 0.3; }
  brazo(-1, al); brazo(1, ar);
  // torso
  const gr = g.createLinearGradient(-u * 2, 0, u * 2, 0); gr.addColorStop(0, oscuro(cam, 0.6)); gr.addColorStop(0.45, cam); gr.addColorStop(1, oscuro(cam, 0.55));
  g.fillStyle = gr; g.beginPath(); g.moveTo(-u * 1.9, -u * 8.3); g.quadraticCurveTo(0, -u * 8.8, u * 1.9, -u * 8.3); g.lineTo(u * 1.6, -u * 5.1); g.lineTo(-u * 1.6, -u * 5.1); g.closePath(); g.fill();
  if (o.num) { g.fillStyle = 'rgba(255,255,255,.95)'; g.font = `800 ${u * 2}px MB`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(o.num, 0, -u * 6.6); }
  // cabeza
  g.fillStyle = pielO; g.fillRect(-u * 0.4, -u * 9.1, u * 0.8, u * 0.8);
  const hg = g.createRadialGradient(-u * 0.3, -u * 10.2, u * 0.2, 0, -u * 9.9, u * 1.3); hg.addColorStop(0, '#F2C39A'); hg.addColorStop(1, pielO);
  g.fillStyle = hg; g.beginPath(); g.ellipse(0, -u * 9.9, u * 1.05, u * 1.2, 0, 0, 7); g.fill();
  g.fillStyle = pelo; g.beginPath(); g.ellipse(0, -u * 10.65, u * 1.1, u * 0.62, 0, Math.PI, 0); g.fill();
  if (o.espalda) { g.beginPath(); g.ellipse(0, -u * 10.2, u * 1.08, u * 1, 0, 0, 7); g.fill(); }
  else {
    g.fillStyle = '#2A1A12'; g.beginPath(); g.arc(-u * 0.38, -u * 9.95, u * 0.11, 0, 7); g.arc(u * 0.38, -u * 9.95, u * 0.11, 0, 7); g.fill();
    g.strokeStyle = '#7A3B26'; g.lineWidth = u * 0.12; g.beginPath();
    if (o.lagrimas) g.arc(0, -u * 9.2, u * 0.3, Math.PI * 1.15, Math.PI * 1.85); else g.arc(0, -u * 9.55, u * 0.35, 0.2, Math.PI - 0.2); g.stroke();
    if (o.lagrimas) { g.fillStyle = 'rgba(150,200,255,.9)'; const ly = -u * 9.7 + ((f * 0.4) % 1) * u * 0.9; g.beginPath(); g.arc(-u * 0.45, ly, u * 0.12, 0, 7); g.arc(u * 0.45, ly + u * 0.2, u * 0.12, 0, 7); g.fill(); }
  }
  g.restore();
}
function balon(x, y, r, rot) { g.save(); g.translate(x, y); g.rotate(rot || 0);
  const gr = g.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r); gr.addColorStop(0, '#fff'); gr.addColorStop(1, '#BDBDBD');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.fillStyle = '#222';
  for (let k = 0; k < 5; k++) { const a = k * 1.2566; g.beginPath(); g.arc(Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.62, r * 0.2, 0, 7); g.fill(); }
  g.beginPath(); g.arc(0, 0, r * 0.26, 0, 7); g.fill(); g.restore(); }
function trofeo(x, y, s) { g.save(); g.translate(x, y); g.scale(s, s);
  const gr = g.createLinearGradient(-60, 0, 60, 0); gr.addColorStop(0, '#8E99A6'); gr.addColorStop(0.45, '#F4F7FA'); gr.addColorStop(1, '#7D8794'); g.fillStyle = gr;
  g.beginPath(); g.moveTo(-55, -150); g.quadraticCurveTo(-60, -40, 0, -20); g.quadraticCurveTo(60, -40, 55, -150); g.closePath(); g.fill();
  g.fillRect(-10, -25, 20, 50); g.beginPath(); g.roundRect(-40, 22, 80, 22, 6); g.fill();
  g.lineWidth = 12; g.strokeStyle = gr; g.beginPath(); g.arc(-62, -110, 26, 1.2, 5.2); g.stroke(); g.beginPath(); g.arc(62, -110, 26, -2, 1.9); g.stroke(); g.restore(); }
function confeti(t, t0, cols) { const r = t - t0; if (r < 0) return;
  for (let k = 0; k < 140; k++) { const x = rnd(k) * W + Math.sin(r * 2 + k) * 40, y = -40 + ((r * (180 + rnd(k + 2) * 260) + rnd(k + 4) * 400) % (H + 80));
    g.save(); g.translate(x, y); g.rotate(r * 4 + k); g.fillStyle = cols[k % cols.length]; g.fillRect(-9, -5, 18, 10); g.restore(); } }

// ---------- textos: subtítulos palabra por palabra, contadores ----------
function palabras(i) {  // tiempos aproximados por palabra, proporcionales a las letras
  const out = [];
  for (const se of T.scenes[i].sents) { const ws = se.text.split(/\s+/).filter(Boolean), tot = ws.reduce((a, w) => a + w.length + 2, 0); let acc = 0;
    for (const w of ws) { const a = se.start + (acc / tot) * (se.end - se.start); acc += w.length + 2; out.push({ w, a, b: se.start + (acc / tot) * (se.end - se.start) }); } }
  return out;
}
const PAL = {};
function subtitulos(i, t) {
  const ws = PAL[i] || (PAL[i] = palabras(i)); if (!ws.length || t < ws[0].a - 0.05) return;
  let k = ws.findIndex(w => t < w.b); if (k < 0) k = ws.length - 1;
  g.font = '800 64px MB'; g.textBaseline = 'middle';
  if (!ws.grp) { ws.grp = []; let cur = 0, n = 0;  // grupos de hasta 4 palabras que quepan a lo ancho
    ws.forEach((w, j) => { const wd = g.measureText(w.w).width + 18; if (n >= 4 || (n && cur + wd > 940)) { cur = 0; n = 0; } if (!n) ws.grp.push(j); cur += wd; n++; ws[j].g = ws.grp.length - 1; }); }
  const gi = ws[k].g, g0 = ws.grp[gi], grp = ws.slice(g0, gi + 1 < ws.grp.length ? ws.grp[gi + 1] : ws.length), y = 300; const sp = 18, wd = grp.map(w => g.measureText(w.w).width), tw = wd.reduce((a, b) => a + b, 0) + sp * (grp.length - 1);
  let x = W / 2 - tw / 2;
  grp.forEach((w, j) => { const on = g0 + j === k, dim = g0 + j > k;
    if (on) { const p = back((t - w.a) / 0.18); g.save(); g.fillStyle = OR; g.globalAlpha = 0.95; g.beginPath(); g.roundRect(x - 12, y - 44 * p, wd[j] + 24, 88 * p, 14); g.fill(); g.restore(); }
    g.fillStyle = dim ? 'rgba(255,255,255,.38)' : '#fff'; g.shadowColor = 'rgba(0,0,0,.7)'; g.shadowBlur = on ? 0 : 14; g.textAlign = 'left'; g.fillText(w.w, x, y + 2); g.shadowBlur = 0; x += wd[j] + sp; });
}
function contador(c, t, i) {
  const t0 = sentAt(i, c.s, c.at), r = t - t0; if (r < 0) return;
  const p = c.dur === 0 ? 1 : ease(r / (c.dur || 1.2)), v = Math.round((c.desde || 0) + (c.n - (c.desde || 0)) * p), a = back(r / 0.35);
  const txt = (c.pre || '') + v.toLocaleString('es-MX') + (c.suf || ''), y = c.y || 1520;
  g.save(); g.translate(c.x || W / 2, y); g.scale(a, a);
  g.font = `800 ${c.big || 96}px MB`; const w1 = g.measureText(txt).width; g.font = '600 40px MS'; const w2 = c.l ? g.measureText(c.l).width + 18 : 0, w = w1 + w2 + 70;
  g.fillStyle = 'rgba(18,14,12,.82)'; g.beginPath(); g.roundRect(-w / 2, -70, w, 140, 26); g.fill();
  g.strokeStyle = c.color === 'red' ? '#FF5A4A' : 'rgba(255,233,176,.35)'; g.lineWidth = 3; g.stroke();
  g.textBaseline = 'middle'; g.textAlign = 'left'; g.font = `800 ${c.big || 96}px MB`; g.fillStyle = c.color === 'red' ? '#FF6A5A' : CREAM; g.fillText(txt, -w / 2 + 35, 4);
  if (c.l) { g.font = '600 40px MS'; g.fillStyle = '#F3E6CF'; g.fillText(c.l, -w / 2 + 35 + w1 + 18, 10); }
  g.restore();
}
function etiqueta(txt, x, y, a, col) { if (a <= 0) return; g.save(); g.globalAlpha = a; g.font = '800 46px MB'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const w = g.measureText(txt).width + 50; g.fillStyle = col || 'rgba(18,14,12,.8)'; g.beginPath(); g.roundRect(x - w / 2, y - 38, w, 76, 38); g.fill(); g.fillStyle = '#fff'; g.fillText(txt, x, y + 2); g.restore(); }

// ---------- escenas ----------
const V = {};
V.isla = (i, r, t) => {
  fondo('mar', t); const p = ease(r / 1.5), y0 = H * 0.63;
  g.save(); g.translate(W / 2, y0); g.scale(1 + 0.08 * p, 1 + 0.08 * p);
  const gr = g.createLinearGradient(0, -330, 0, 0); gr.addColorStop(0, '#5E8C4A'); gr.addColorStop(1, '#2F4A2A'); g.fillStyle = gr;
  g.beginPath(); g.moveTo(-520, 0); g.bezierCurveTo(-380, -200, -220, -330, -40, -320); g.bezierCurveTo(140, -310, 300, -180, 520, 0); g.closePath(); g.fill();
  for (let k = 0; k < 22; k++) { const hx = -330 + rnd(k) * 600, hy = -40 - rnd(k + 1) * 230 * (1 - Math.abs(hx) / 560);
    g.fillStyle = '#F3EEE4'; g.fillRect(hx, hy, 30, 24); g.fillStyle = '#C4502E'; g.beginPath(); g.moveTo(hx - 4, hy); g.lineTo(hx + 15, hy - 14); g.lineTo(hx + 34, hy); g.fill(); }
  g.restore();
  const sg = g.createLinearGradient(0, H * 0.8, 0, H); sg.addColorStop(0, '#C9A57A'); sg.addColorStop(1, '#8A6A48'); g.fillStyle = sg;
  g.beginPath(); g.moveTo(0, H * 0.82); g.quadraticCurveTo(W / 2, H * 0.78, W, H * 0.82); g.lineTo(W, H); g.lineTo(0, H); g.fill();
  fig(W / 2 - 40, H * 0.93, 430, { camisa: '#C8102E', short: '#3A3A3A', medias: '#EEE', pose: 'stand' }); balon(W / 2 + 110, H * 0.93 - 30, 38, r);
};
V.barco = (i, r, t) => {
  fondo('noche', t); g.fillStyle = '#123150'; g.fillRect(0, 520, W, 1300);
  for (let k = 0; k < 40; k++) { g.fillStyle = 'rgba(120,180,230,.12)'; g.fillRect((rnd(k) * W + t * 30) % W, 540 + rnd(k + 1) * 1250, 80, 3); }
  g.fillStyle = '#3F5A35'; g.beginPath(); g.moveTo(560, 520); g.bezierCurveTo(700, 640, 760, 760, 1080, 820); g.lineTo(1080, 520); g.fill();  // costa
  g.beginPath(); g.ellipse(250, 1600, 120, 60, -0.2, 0, 7); g.fill();  // isla
  etiqueta('LISBOA', 850, 600, ease(r / 0.6)); etiqueta('MADEIRA', 250, 1700, ease(r / 0.6));
  const P = q => { const a = 1 - q; return [a * a * 300 + 2 * a * q * 300 + q * q * 760, a * a * 1540 + 2 * a * q * 900 + q * q * 760]; };
  const q = ease((r - 0.6) / Math.max(1, (winEnd(i) - T.cuts[i]) - 1.4));
  g.setLineDash([18, 16]); g.lineWidth = 8; g.strokeStyle = CREAM; g.beginPath(); for (let k = 0; k <= 60 * q; k++) { const [x, y] = P(k / 60); k ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); g.setLineDash([]);
  const [bx, by] = P(q); g.save(); g.translate(bx, by + Math.sin(t * 3) * 6);
  g.scale(1.6, 1.6); g.fillStyle = '#C4502E'; g.fillRect(-40, -46, 34, 30); fig(22, -2, 90, { camisa: '#C8102E', short: '#3A3A3A', medias: '#EEE', espalda: true });
  g.fillStyle = '#F3EEE4'; g.beginPath(); g.moveTo(-70, 0); g.lineTo(70, 0); g.lineTo(50, 34); g.lineTo(-50, 34); g.fill(); g.restore();
};
V.corazon = (i, r, t) => {
  fondo('calido', t); const calma = t > sentAt(i, 1, 0) ? ease((t - sentAt(i, 1, 0)) / 0.8) : 0, bpm = lerp(3.4, 1.2, calma);
  const b = Math.pow(Math.max(0, Math.sin(t * bpm * Math.PI)), 6), s = 1 + 0.12 * b;
  g.save(); g.translate(W / 2, 880); g.scale(s * 2.4, s * 2.4); const col = calma > 0.5 ? '#FF7A4A' : '#E0282E';
  const gr = g.createRadialGradient(-30, -40, 10, 0, 0, 140); gr.addColorStop(0, '#FF9A8A'); gr.addColorStop(1, col); g.fillStyle = gr;
